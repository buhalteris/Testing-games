<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #02030a;
    touch-action: none;
  }
  #hud {
    position: fixed;
    top: 10px;
    left: 14px;
    font-size: 18px;
    pointer-events: none;
    text-shadow: 0 0 6px #0ff;
  }
  #soundBtn {
    position: fixed;
    top: 8px;
    right: 10px;
    padding: 6px 10px;
    font-size: 14px;
    background: rgba(0, 0, 0, 0.4);
    color: #0ff;
    border: 1px solid #0ff;
    border-radius: 6px;
    cursor: pointer;
    z-index: 2;
  }
  #help {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    opacity: 0.6;
    pointer-events: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.6);
    text-align: center;
  }
  #overlay h1 {
    font-size: 48px;
    margin: 0 0 12px;
    text-shadow: 0 0 14px #0ff;
  }
  #overlay p {
    font-size: 18px;
    margin: 6px 0;
    opacity: 0.85;
  }
  #overlay button {
    margin-top: 20px;
    padding: 12px 28px;
    font-size: 18px;
    background: transparent;
    color: #0ff;
    border: 2px solid #0ff;
    border-radius: 6px;
    cursor: pointer;
  }
  #overlay button:hover { background: #0ff; color: #000; }
  .hidden { display: none !important; }
  @media (max-width: 600px) {
    #overlay h1 { font-size: 36px; }
    #help { font-size: 11px; }
    #hud { font-size: 15px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">Score: <span id="score">0</span> &nbsp; Lives: <span id="lives">3</span> &nbsp; Wave: <span id="wave">1</span></div>
<button id="soundBtn" type="button">🔊 Sound on (M)</button>
<div id="help">Arrows / WASD: move &nbsp;|&nbsp; Space: fire &nbsp;|&nbsp; P: pause<br>Phone: drag to move (auto-fires) &nbsp;|&nbsp; double-tap to pause</div>

<div id="overlay">
  <h1 id="title">SPACE SHOOTER</h1>
  <p id="message">Destroy asteroids and enemy ships. Survive as long as you can.</p>
  <button id="startBtn">Start</button>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const waveEl = document.getElementById('wave');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const messageEl = document.getElementById('message');
  const startBtn = document.getElementById('startBtn');
  const soundBtn = document.getElementById('soundBtn');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Audio ----
  // Sound effects and a composed background song, all generated with the Web Audio API.
  const audio = (function () {
    let ac = null, master = null, musicBus = null, sfxBus = null;
    let muted = false;
    let musicTimer = null, nextNoteTime = 0, songPos = 0;

    // ----- Song -----
    // 118 BPM, 4/4. Each bar has 8 eighth-note slots.
    // Structure (48 bars, ~100 s):
    //   Intro (4) > Verse (8) > Chorus (8) > Build-up (4) > Verse 2, higher (8)
    //   > Bridge in C major (8) > Outro (8, back in A minor)
    const BPM = 118, EIGHTH = 60 / BPM / 2;
    const ARP = [0, 1, 2, 1, 0, 2, 1, 2];        // arpeggio order over a 3-note chord
    const ARP_MARK = -2;                          // lead slot meaning "play arpeggio"
    const REST = -1;                              // lead slot meaning "silence"
    const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

    // Chord voicings (MIDI numbers)
    const Am = [57, 60, 64], F = [53, 57, 60], C = [48, 52, 55], G = [55, 59, 62];
    const Dm = [50, 53, 57], E = [52, 56, 59], Em = [52, 55, 59];

    const R = [REST, REST, REST, REST, REST, REST, REST, REST];
    const ARPS = [ARP_MARK, ARP_MARK, ARP_MARK, ARP_MARK, ARP_MARK, ARP_MARK, ARP_MARK, ARP_MARK];
    const up = (line) => line.map(n => (n > 0 ? n + 12 : n));

    // Verse melody (A minor), one row per bar
    const verseLead = [
      [69, 72, 74, 72, 69, 67, 69, REST],
      [65, 69, 72, 69, 65, 64, 65, REST],
      [67, 72, 76, 72, 67, 64, 67, REST],
      [67, 71, 74, 71, 67, 66, 67, REST],
      [69, 72, 74, 76, 77, 76, 74, 72],
      [77, 74, 72, 69, 72, REST, 69, 65],
      [68, 71, 73, 76, 73, 71, 68, REST],
      [69, REST, REST, REST, 69, REST, REST, REST]
    ];
    // Chorus melody (F, G, Am, Em...), brighter and higher
    const chorusLead = [
      [77, 77, 76, 74, 72, 74, 76, REST],
      [79, 76, 74, 71, 74, 71, 67, REST],
      [72, 76, 79, 76, 72, REST, 74, 72],
      [71, 67, 64, 67, 71, 74, 71, REST],
      [72, 77, 76, 77, 79, 77, 76, 74],
      [74, 71, 67, 71, 74, 79, REST, 74],
      [76, 74, 72, 69, 72, 74, 76, REST],
      [76, REST, 75, REST, 76, REST, 80, REST]
    ];
    // Bridge melody (C major), rising and falling
    const bridgeLead = [
      [72, 74, 76, 79, 76, 74, 72, REST],
      [69, 72, 74, 76, 74, 72, 69, REST],
      [77, 76, 74, 72, 74, 77, 76, REST],
      [74, 71, 67, 71, 74, REST, 79, REST],
      [72, REST, 76, REST, 79, REST, 84, REST],
      [83, 79, 76, 79, 72, 74, 76, REST],
      [77, 76, 74, 72, 71, 69, 71, REST],
      [72, REST, REST, REST, 67, REST, REST, REST]
    ];

    // Build a list of bars: each bar has pad chord, bass note, lead line, drum level (0-3)
    function bars(chords, basses, leads, drums) {
      return chords.map((c, i) => ({ pad: c, bass: basses[i], lead: leads[i], drums: drums }));
    }

    const SONG = [].concat(
      // Intro: pads and bass only
      bars([Am, F, C, G], [45, 41, 36, 43], [R, R, R, R], 0),
      // Verse
      bars([Am, F, C, G, Am, F, E, Am], [45, 41, 36, 43, 45, 41, 40, 45], verseLead, 1),
      // Chorus
      bars([F, G, Am, Em, F, G, Am, E], [41, 43, 45, 40, 41, 43, 45, 40], chorusLead, 2),
      // Build-up: snare roll, arpeggios
      bars([Dm, E, Am, E], [38, 40, 45, 40], [ARPS, ARPS, ARPS, ARPS], 3),
      // Verse 2, an octave higher
      bars([Am, F, C, G, Am, F, E, Am], [45, 41, 36, 43, 45, 41, 40, 45], verseLead.map(up), 2),
      // Bridge in C major
      bars([C, Am, F, G, C, Am, F, G], [36, 45, 41, 43, 36, 45, 41, 43], bridgeLead, 2),
      // Outro: verse melody again with full drums
      bars([Am, F, C, G, Am, F, E, Am], [45, 41, 36, 43, 45, 41, 40, 45], verseLead, 2)
    );

    function init() {
      try {
        if (!ac) {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          master = ac.createGain();
          master.gain.value = muted ? 0 : 0.8;
          master.connect(ac.destination);
          musicBus = ac.createGain();
          musicBus.gain.value = 0.22;
          musicBus.connect(master);
          sfxBus = ac.createGain();
          sfxBus.gain.value = 0.5;
          sfxBus.connect(master);
        }
        if (ac.state === 'suspended') ac.resume();
      } catch (e) { ac = null; }
    }

    function tone(freq, dur, type, vol, dest, when, slideTo) {
      if (!ac) return;
      const t = when || ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest);
      o.start(t); o.stop(t + dur + 0.05);
    }

    function noise(dur, vol, cutoff, dest, when) {
      if (!ac) return;
      const t = when || ac.currentTime;
      const len = Math.floor(ac.sampleRate * dur);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
      const g = ac.createGain(); g.gain.value = vol;
      src.connect(f); f.connect(g); g.connect(dest || sfxBus);
      src.start(t);
    }

    // ----- Sound effects -----
    function shoot() { tone(880, 0.09, 'square', 0.12, sfxBus, 0, 330); }
    function enemyShot() { tone(320, 0.14, 'sawtooth', 0.08, sfxBus, 0, 160); }
    function explode(size) {
      noise(0.25 + size * 0.1, 0.25 + size * 0.1, 500 + size * 300);
      tone(110 - size * 15, 0.3, 'sine', 0.2, sfxBus, 0, 40);
    }
    function hit() {
      noise(0.6, 0.9, 700);
      tone(160, 0.5, 'sawtooth', 0.25, sfxBus, 0, 40);
    }
    function wave() {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      const t = ac ? ac.currentTime : 0;
      notes.forEach((n, i) => tone(n, 0.18, 'triangle', 0.2, sfxBus, t + i * 0.08));
    }
    function gameOver() {
      const t = ac ? ac.currentTime : 0;
      [440, 330, 220, 110].forEach((n, i) => tone(n, 0.5, 'sawtooth', 0.18, sfxBus, t + i * 0.25));
    }

    // ----- Music playback -----
    function kick(t) { tone(120, 0.18, 'sine', 0.5, musicBus, t, 40); }
    function hat(t) { noise(0.03, 0.06, 8000, musicBus, t); }
    function snare(t, vol) {
      noise(0.12, vol, 2500, musicBus, t);
      tone(200, 0.08, 'triangle', 0.12, musicBus, t);
    }

    // Play one eighth-note slot (i = 0..7) of a bar at time t
    function playEighth(bar, i, t) {
      // Pad: chord held for the whole bar
      if (i === 0) bar.pad.forEach(n => tone(mtof(n), EIGHTH * 8, 'sine', 0.045, musicBus, t));

      // Bass: root and octave on the even eighths
      if (i % 2 === 0) {
        tone(mtof(i % 4 === 0 ? bar.bass : bar.bass + 12), EIGHTH * 1.8, 'triangle', 0.3, musicBus, t);
      }

      // Lead melody or arpeggio
      const n = bar.lead[i];
      if (n > 0) tone(mtof(n), EIGHTH * 0.9, 'square', 0.06, musicBus, t);
      else if (n === ARP_MARK) tone(mtof(bar.pad[ARP[i]] + 12), EIGHTH * 0.9, 'square', 0.05, musicBus, t);

      // Drums
      if (bar.drums >= 1) {
        if (i % 4 === 0) kick(t);
        hat(t);
      }
      if (bar.drums === 2 && (i === 2 || i === 6)) snare(t, 0.2);
      if (bar.drums === 3) snare(t, 0.06 + i * 0.025); // build-up: rising snare roll
    }

    function musicTick() {
      if (!ac) return;
      while (nextNoteTime < ac.currentTime + 0.15) {
        const bar = SONG[Math.floor(songPos / 8) % SONG.length];
        playEighth(bar, songPos % 8, nextNoteTime);
        nextNoteTime += EIGHTH;
        songPos++;
      }
    }

    function startMusic() {
      if (!ac || musicTimer) return;
      nextNoteTime = ac.currentTime + 0.05;
      musicTimer = setInterval(musicTick, 25);
    }

    function stopMusic() {
      if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    }

    function restartSong() {
      songPos = 0;
    }

    function toggleMute() {
      muted = !muted;
      if (master) master.gain.setValueAtTime(muted ? 0 : 0.8, ac.currentTime);
      return muted;
    }

    return { init, shoot, enemyShot, explode, hit, wave, gameOver,
             startMusic, stopMusic, restartSong, toggleMute, isMuted: () => muted };
  })();

  function refreshSoundBtn() {
    soundBtn.textContent = audio.isMuted() ? '🔇 Sound off (M)' : '🔊 Sound on (M)';
  }
  function onToggleMute() {
    audio.init();
    audio.toggleMute();
    refreshSoundBtn();
  }
  soundBtn.addEventListener('click', onToggleMute);

  // ---- Input ----
  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    if (e.code === 'KeyP' && state === 'playing') togglePause();
    if (e.code === 'KeyM') onToggleMute();
    if ((e.code === 'Enter' || e.code === 'Space') && (state === 'menu' || state === 'over')) startGame();
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  startBtn.addEventListener('click', startGame);

  // ---- Touch input (phones / tablets) ----
  // Drag anywhere to move the ship (it sits just above your finger so you can see it).
  // The ship fires automatically while a finger is touching the screen.
  const touch = { active: false, x: 0, y: 0 };
  function setTouch(t) {
    touch.x = t.clientX;
    touch.y = t.clientY - 60;
  }
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    audio.init();
    touch.active = true;
    setTouch(e.touches[0]);
    if (state === 'menu' || state === 'over') startGame();
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches[0]) setTouch(e.touches[0]);
  }, { passive: false });
  const endTouch = (e) => {
    e.preventDefault();
    if (!e.touches || e.touches.length === 0) touch.active = false;
  };
  canvas.addEventListener('touchend', endTouch, { passive: false });
  canvas.addEventListener('touchcancel', endTouch, { passive: false });
  // Double-tap the screen while playing to pause/resume on phones (no P key)
  canvas.addEventListener('dblclick', () => { if (state === 'playing' || state === 'paused') togglePause(); });

  // ---- Game state ----
  let state = 'menu'; // menu | playing | paused | over
  let player, bullets, enemyBullets, asteroids, enemies, particles, stars;
  let score, lives, wave, invuln, fireCooldown, spawnTimer, enemyTimer, waveTimer, shake;
  let lastTime = 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function makeStars() {
    stars = [];
    for (let i = 0; i < 140; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: rand(0.2, 1),       // depth: bigger = closer / faster
        r: rand(0.5, 1.6)
      });
    }
  }

  function resetGame() {
    player = { x: W / 2, y: H - 80, vx: 0, vy: 0, r: 14 };
    bullets = [];
    enemyBullets = [];
    asteroids = [];
    enemies = [];
    particles = [];
    score = 0;
    lives = 3;
    wave = 1;
    invuln = 2;
    fireCooldown = 0;
    spawnTimer = 0;
    enemyTimer = 3;
    waveTimer = 0;
    shake = 0;
    updateHud();
  }

  function startGame() {
    if (state === 'playing') return;
    audio.init(); // browsers only allow audio after a user gesture like this click
    if (!stars) makeStars();
    resetGame();
    state = 'playing';
    overlay.classList.add('hidden');
    audio.restartSong();
    audio.startMusic();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      audio.stopMusic();
      showOverlay('PAUSED', 'Press P to resume.', 'Resume');
    } else if (state === 'paused') {
      state = 'playing';
      overlay.classList.add('hidden');
      audio.startMusic();
    }
  }

  function showOverlay(title, msg, btn) {
    titleEl.textContent = title;
    messageEl.textContent = msg;
    startBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }

  function gameOver() {
    state = 'over';
    audio.stopMusic();
    audio.gameOver();
    showOverlay('GAME OVER', 'Final score: ' + score + '  •  Wave ' + wave, 'Play again');
  }

  function updateHud() {
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    waveEl.textContent = wave;
  }

  // ---- Helpers ----
  function explode(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = rand(40, 220);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.9), max: 0.9, color });
    }
  }

  function makeAsteroidVerts(r) {
    const verts = [];
    for (let j = 0; j < 9; j++) {
      const a = (j / 9) * Math.PI * 2;
      const rr = r * rand(0.75, 1.15);
      verts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    return verts;
  }

  function spawnAsteroid() {
    const size = pick([3, 2, 1]); // 3 big, 2 medium, 1 small
    const r = size === 3 ? 42 : size === 2 ? 24 : 13;
    const speed = rand(60, 120) + wave * 8;
    asteroids.push({
      x: rand(r, W - r), y: -r, vx: rand(-40, 40), vy: speed,
      r, size, verts: makeAsteroidVerts(r), rot: rand(0, Math.PI * 2), spin: rand(-1.5, 1.5)
    });
  }

  function spawnEnemy() {
    const fromLeft = Math.random() < 0.5;
    const y = rand(60, H * 0.4);
    enemies.push({
      x: fromLeft ? -30 : W + 30,
      y: y,
      vx: (fromLeft ? 1 : -1) * rand(70, 110),
      baseY: y,
      t: rand(0, 10),
      fireTimer: rand(0.8, 1.6),
      r: 16
    });
  }

  function circleHit(ax, ay, ar, bx, by, br) {
    const dx = ax - bx, dy = ay - by, rr = ar + br;
    return dx * dx + dy * dy < rr * rr;
  }

  function splitOrRemoveAsteroid(a, i) {
    asteroids.splice(i, 1);
    const points = a.size * 10;
    score += points;
    explode(a.x, a.y, '#9ab', 14 + a.size * 6);
    audio.explode(a.size);
    shake = Math.max(shake, a.size * 1.5);
    if (a.size > 1) {
      for (let k = 0; k < 2; k++) {
        const newSize = a.size - 1;
        const r = newSize === 2 ? 24 : 13;
        asteroids.push({
          x: a.x, y: a.y,
          vx: a.vx + rand(-90, 90), vy: a.vy + rand(-30, 30),
          r, size: newSize, verts: makeAsteroidVerts(r), rot: rand(0, 6), spin: rand(-2.5, 2.5)
        });
      }
    }
  }

  function loseLife() {
    lives--;
    explode(player.x, player.y, '#ff8844', 40);
    audio.hit();
    shake = 12;
    updateHud();
    if (lives <= 0) {
      gameOver();
    } else {
      player.x = W / 2;
      player.y = H - 80;
      player.vx = player.vy = 0;
      invuln = 2;
    }
  }

  // ---- Update ----
  function update(dt) {
    // Stars scroll
    for (const s of stars) {
      s.y += s.z * 60 * dt;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 30);
    if (invuln > 0) invuln -= dt;

    // Player movement
    const accel = 1400, maxSpeed = 360, friction = 0.88;
    let ax = 0, ay = 0;
    if (keys.ArrowLeft || keys.KeyA) ax -= 1;
    if (keys.ArrowRight || keys.KeyD) ax += 1;
    if (keys.ArrowUp || keys.KeyW) ay -= 1;
    if (keys.ArrowDown || keys.KeyS) ay += 1;
    if (touch.active) {
      // steer toward the finger
      const dx = touch.x - player.x, dy = touch.y - player.y;
      const d = Math.hypot(dx, dy);
      if (d > 6) { ax = dx / d; ay = dy / d; }
    }
    player.vx += ax * accel * dt;
    player.vy += ay * accel * dt;
    player.vx *= friction;
    player.vy *= friction;
    const sp = Math.hypot(player.vx, player.vy);
    if (sp > maxSpeed) { player.vx *= maxSpeed / sp; player.vy *= maxSpeed / sp; }
    player.x = Math.min(W - player.r, Math.max(player.r, player.x + player.vx * dt));
    player.y = Math.min(H - player.r, Math.max(player.r, player.y + player.vy * dt));

    // Shooting
    fireCooldown -= dt;
    if ((keys.Space || touch.active) && fireCooldown <= 0) {
      bullets.push({ x: player.x, y: player.y - 18, vy: -620 });
      fireCooldown = 0.22;
      audio.shoot();
    }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.y += b.vy * dt;
      if (b.y < -10) bullets.splice(i, 1);
    }
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y > H + 10 || b.x < -10 || b.x > W + 10) enemyBullets.splice(i, 1);
    }

    // Wave progression: every 20 seconds, harder
    waveTimer += dt;
    if (waveTimer >= 20) {
      waveTimer = 0;
      wave++;
      updateHud();
      audio.wave();
    }

    // Spawning
    spawnTimer -= dt;
    const spawnEvery = Math.max(0.35, 1.2 - wave * 0.08);
    if (spawnTimer <= 0) {
      spawnAsteroid();
      spawnTimer = spawnEvery * rand(0.7, 1.3);
    }
    enemyTimer -= dt;
    if (enemyTimer <= 0 && wave >= 2) {
      spawnEnemy();
      enemyTimer = Math.max(3, 7 - wave * 0.4) * rand(0.8, 1.2);
    }

    // Asteroids
    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      a.x += a.vx * dt; a.y += a.vy * dt; a.rot += a.spin * dt;
      if (a.y > H + a.r * 2 || a.x < -100 || a.x > W + 100) asteroids.splice(i, 1);
    }

    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.t += dt;
      e.x += e.vx * dt;
      e.y = e.baseY + Math.sin(e.t * 2) * 30;
      e.fireTimer -= dt;
      if (e.fireTimer <= 0 && e.x > 0 && e.x < W) {
        const dx = player.x - e.x, dy = player.y - e.y;
        const d = Math.hypot(dx, dy) || 1;
        const s = 260;
        enemyBullets.push({ x: e.x, y: e.y + 12, vx: dx / d * s, vy: dy / d * s });
        audio.enemyShot();
        e.fireTimer = rand(1.1, 2.0) - Math.min(0.6, wave * 0.05);
      }
      if (e.x < -60 || e.x > W + 60) enemies.splice(i, 1);
    }

    // Collisions: player bullets vs asteroids / enemies
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      let hit = false;
      for (let j = asteroids.length - 1; j >= 0; j--) {
        const a = asteroids[j];
        if (circleHit(b.x, b.y, 3, a.x, a.y, a.r)) {
          bullets.splice(i, 1);
          splitOrRemoveAsteroid(a, j);
          hit = true;
          break;
        }
      }
      if (hit) continue;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (circleHit(b.x, b.y, 3, e.x, e.y, e.r)) {
          bullets.splice(i, 1);
          enemies.splice(j, 1);
          score += 100;
          explode(e.x, e.y, '#f55', 30);
          audio.explode(2);
          shake = Math.max(shake, 5);
          updateHud();
          break;
        }
      }
    }

    // Collisions: player vs asteroids / enemies / enemy bullets
    if (invuln <= 0) {
      let dead = false;
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        if (circleHit(player.x, player.y, player.r * 0.8, a.x, a.y, a.r * 0.85)) {
          splitOrRemoveAsteroid(a, i);
          dead = true;
          break;
        }
      }
      if (!dead) {
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (circleHit(player.x, player.y, player.r, e.x, e.y, e.r)) {
            enemies.splice(i, 1);
            dead = true;
            break;
          }
        }
      }
      if (!dead) {
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
          const b = enemyBullets[i];
          if (circleHit(player.x, player.y, player.r * 0.8, b.x, b.y, 4)) {
            enemyBullets.splice(i, 1);
            dead = true;
            break;
          }
        }
      }
      if (dead) { loseLife(); updateHud(); }
    }

    updateHud();
  }

  // ---- Drawing ----
  function drawShip(x, y, flicker) {
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = flicker ? 0.35 : 1;
    ctx.shadowColor = '#4ff';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#7ef';
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(14, 14);
    ctx.lineTo(0, 7);
    ctx.lineTo(-14, 14);
    ctx.closePath();
    ctx.fill();
    // engine flame
    const flame = 6 + Math.random() * 6;
    ctx.fillStyle = '#f80';
    ctx.beginPath();
    ctx.moveTo(-6, 12);
    ctx.lineTo(0, 12 + flame);
    ctx.lineTo(6, 12);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.shadowColor = '#f44';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#c33';
    ctx.beginPath();
    ctx.moveTo(0, 14);
    ctx.lineTo(18, -6);
    ctx.lineTo(8, -12);
    ctx.lineTo(-8, -12);
    ctx.lineTo(-18, -6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ff0';
    ctx.fillRect(-3, -2, 6, 4);
    ctx.restore();
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.strokeStyle = '#9ab';
    ctx.fillStyle = '#334';
    ctx.lineWidth = 2;
    ctx.beginPath();
    a.verts.forEach(([vx, vy], i) => i ? ctx.lineTo(vx, vy) : ctx.moveTo(vx, vy));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

    ctx.fillStyle = '#02030a';
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // Stars
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      ctx.globalAlpha = 0.3 + s.z * 0.7;
      ctx.fillRect(s.x, s.y, s.r * s.z * 1.6, s.r * s.z * 1.6);
    }
    ctx.globalAlpha = 1;

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;

    for (const a of asteroids) drawAsteroid(a);
    for (const e of enemies) drawEnemy(e);

    // Player bullets
    ctx.fillStyle = '#ff0';
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 8;
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 7, 4, 14);

    // Enemy bullets
    ctx.fillStyle = '#f66';
    ctx.shadowColor = '#f44';
    for (const b of enemyBullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Player (not shown on the game-over screen)
    if (state === 'playing' || state === 'paused') {
      const flicker = invuln > 0 && Math.floor(invuln * 12) % 2 === 0;
      drawShip(player.x, player.y, flicker);
    }

    ctx.restore();
  }

  // ---- Main loop ----
  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0);
    lastTime = ts;

    if (state === 'playing') {
      update(dt);
    } else {
      // keep the background drifting for atmosphere
      if (!stars) makeStars();
      for (const s of stars) {
        s.y += s.z * 30 * dt;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      }
    }
    render();
    requestAnimationFrame(loop);
  }

  makeStars();
  resize();
  resetGame(); // initialise arrays so the menu background can render safely
  requestAnimationFrame((ts) => { lastTime = ts; loop(ts); });
})();
</script>
</body>
</html>
