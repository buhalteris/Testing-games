<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<title>Starfall — 3D space shooter</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#02030a;color:#e8ecff;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;pointer-events:none;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.5px;text-shadow:0 0 10px #3ad6ff}
#hull{font-size:20px;color:#ff6b8a;text-shadow:0 0 10px #ff6b8a;text-align:center}
#right{text-align:right}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(2,3,10,.55)}
#msg.hide{display:none}
.card{max-width:340px;text-align:center;background:rgba(12,16,38,.88);border:1px solid #2a3a70;border-radius:16px;padding:26px 22px;box-shadow:0 0 40px rgba(58,214,255,.15)}
h1{margin:0 0 10px;font-size:34px;letter-spacing:4px;color:#3ad6ff;text-shadow:0 0 18px #3ad6ff}
p{margin:0 0 20px;line-height:1.55;color:#b9c4ea;font-size:15px}
b{color:#fff}
button{font:inherit;font-weight:700;font-size:17px;padding:12px 34px;border-radius:999px;border:0;background:#3ad6ff;color:#02101f;cursor:pointer;box-shadow:0 0 22px rgba(58,214,255,.55)}
button:active{transform:translateY(1px)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div>SCORE <span id="score">0</span></div>
  <div id="hull">♥♥♥</div>
  <div id="right">BEST <span id="best">0</span></div>
</div>

<div id="msg">
  <div class="card">
    <h1 id="title">STARFALL</h1>
    <p id="desc">Steer with the mouse, a finger, or the arrow keys / WASD.<br>Hold click, tap or Space to fire. Guns fire straight ahead, so line up under a rock.<br>Shoot the asteroids, dodge the ones you can't. Three hits and you're out.</p>
    <button id="go">Launch</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

if (!window.THREE) {
  document.getElementById('desc').textContent = 'The 3D engine (three.js) could not be loaded. Check your connection and reload the page.';
  document.getElementById('go').disabled = true;
  return;
}

const $ = id => document.getElementById(id);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const BEST_KEY = 'starfall-best';
const BULLET_SPEED = 75;
const CAM_Z = 8, CAM_Y = 0.8;
const GUN_SPACING = 0.85;

// ---------- renderer, scene, camera ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.Fog(0x02030a, 40, 170);
const cam = new THREE.PerspectiveCamera(70, 1, 0.1, 400);
scene.add(new THREE.AmbientLight(0x7080b0, 0.7));
const sun = new THREE.DirectionalLight(0xfff2e0, 1.1);
sun.position.set(-4, 6, 5);
scene.add(sun);

// ---------- starfield: stars rush toward the camera ----------
const STAR_N = 1500, STAR_DEPTH = 180;
const starPos = new Float32Array(STAR_N * 3);
for (let i = 0; i < STAR_N; i++) {
  starPos[i * 3] = rnd(-60, 60);
  starPos[i * 3 + 1] = rnd(-35, 35);
  starPos[i * 3 + 2] = rnd(-STAR_DEPTH, 10);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
  color: 0xdfe8ff, size: 0.35, transparent: true, opacity: 0.9
})));
let starSpeed = 10;

// ---------- player ship (nose points down -z) ----------
const ship = new THREE.Group();
ship.position.set(0, -1.5, 0);
scene.add(ship);
const hullMat = new THREE.MeshStandardMaterial({ color: 0xc3cde9, metalness: 0.35, roughness: 0.4, flatShading: true });
const trimMat = new THREE.MeshStandardMaterial({ color: 0x2a8cff, emissive: 0x0b2a55, metalness: 0.3, roughness: 0.4, flatShading: true });
const body = new THREE.Mesh(new THREE.ConeGeometry(0.5, 2.4, 8), hullMat);
body.rotation.x = -Math.PI / 2;
ship.add(body);
const wingGeo = new THREE.BoxGeometry(2.4, 0.08, 0.9);
const wingL = new THREE.Mesh(wingGeo, trimMat);
wingL.position.set(-1.0, 0, 0.35);
wingL.rotation.z = 0.2;
ship.add(wingL);
const wingR = new THREE.Mesh(wingGeo, trimMat);
wingR.position.set(1.0, 0, 0.35);
wingR.rotation.z = -0.2;
ship.add(wingR);
const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 8), new THREE.MeshBasicMaterial({ color: 0x7fe9ff }));
cockpit.position.set(0, 0.28, -0.35);
ship.add(cockpit);
const engine = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.9, 8), new THREE.MeshBasicMaterial({ color: 0xff8a3a }));
engine.rotation.x = Math.PI / 2;
engine.position.set(0, 0, 1.45);
ship.add(engine);

// ---------- shared resources ----------
const bulletGeo = new THREE.BoxGeometry(0.14, 0.14, 1.6);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0x8ff7ff });
const debrisGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);

// Rocks: an icosphere with lumpy vertices. Duplicate vertices get the same jitter so the mesh stays closed.
function makeRock() {
  const g = new THREE.IcosahedronGeometry(1, 1);
  const p = g.attributes.position;
  const jitter = new Map();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const key = Math.round(x * 1e4) + ',' + Math.round(y * 1e4) + ',' + Math.round(z * 1e4);
    if (!jitter.has(key)) jitter.set(key, rnd(0.75, 1.2));
    const k = jitter.get(key);
    p.setXYZ(i, x * k, y * k, z * k);
  }
  g.computeVertexNormals();
  return g;
}
const rockGeos = [makeRock(), makeRock(), makeRock()];
const rockMats = [0x8c8178, 0x6e6862, 0xa08c74].map(c => new THREE.MeshStandardMaterial({
  color: c, roughness: 0.95, metalness: 0.05, flatShading: true
}));

// ---------- game state ----------
let state = 'menu';            // 'menu' | 'play' | 'over'
let score = 0, hull = 3, elapsed = 0, speed = 22;
let spawnTimer = 0, fireTimer = 0, invuln = 0, shake = 0, overAt = 0;
let best = 0;
try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { /* storage unavailable */ }
const aim = { x: 0, y: -1.5 };
const bounds = { x: 6, y: 3.6 };
const asteroids = [];          // { m, r, vx, vy, spin }
const bullets = [];            // { m, v, prev, life }
const debris = [];             // { m, v, t, dur }
const keys = {};
let firing = false;

// ---------- helpers ----------
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  cam.aspect = w / h;
  cam.updateProjectionMatrix();
  // visible half-size of the play plane at distance CAM_Z from the camera
  const halfH = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * CAM_Z;
  bounds.x = Math.min(halfH * cam.aspect * 0.85, 9);
  bounds.y = Math.min(halfH * 0.7, 3.6);
}

function updateHud() {
  $('score').textContent = score;
  $('best').textContent = Math.max(best, score);
  $('hull').textContent = '♥'.repeat(Math.max(0, hull)) + '♡'.repeat(Math.max(0, 3 - hull));
}

// squared distance from point c to the segment a-b
function segDist2(a, b, c) {
  const sx = b.x - a.x, sy = b.y - a.y, sz = b.z - a.z;
  const len2 = sx * sx + sy * sy + sz * sz;
  const t = len2 > 0 ? clamp(((c.x - a.x) * sx + (c.y - a.y) * sy + (c.z - a.z) * sz) / len2, 0, 1) : 0;
  const dx = a.x + sx * t - c.x, dy = a.y + sy * t - c.y, dz = a.z + sz * t - c.z;
  return dx * dx + dy * dy + dz * dz;
}

function boom(x, y, z, color, n) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(debrisGeo, new THREE.MeshBasicMaterial({ color }));
    m.position.set(x, y, z);
    scene.add(m);
    const v = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize().multiplyScalar(rnd(4, 11));
    debris.push({ m, v, t: 0, dur: rnd(0.5, 0.9) });
  }
}

function updateDebris(dt) {
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.t += dt;
    d.m.position.addScaledVector(d.v, dt);
    d.v.multiplyScalar(Math.max(0, 1 - dt * 3));
    if (d.t >= d.dur) {
      scene.remove(d.m);
      d.m.material.dispose();
      debris.splice(i, 1);
    } else {
      d.m.scale.setScalar(1 - d.t / d.dur);
    }
  }
}

// ---------- rocks ----------
function spawnRock() {
  const r = rnd(0.8, 2.1);
  const idx = (Math.random() * 3) | 0;
  const m = new THREE.Mesh(rockGeos[idx], rockMats[idx]);
  m.scale.setScalar(r);
  const spawnX = bounds.x * 1.15 + 0.6;
  m.position.set(rnd(-spawnX, spawnX), rnd(-3.8, 3.8), -150);
  m.rotation.set(rnd(0, 6), rnd(0, 6), rnd(0, 6));
  scene.add(m);
  asteroids.push({
    m, r,
    vx: rnd(-1.2, 1.2),
    vy: rnd(-1, 1),
    spin: new THREE.Vector3(rnd(-1.5, 1.5), rnd(-1.5, 1.5), rnd(-1.5, 1.5))
  });
}

function killRock(j, explode) {
  const a = asteroids[j];
  if (explode) boom(a.m.position.x, a.m.position.y, a.m.position.z, 0xffb070, 14);
  scene.remove(a.m);
  asteroids.splice(j, 1);
}

// guns fire straight ahead, so the player has to line up under a rock
function fireVolley() {
  for (const side of [-GUN_SPACING, GUN_SPACING]) {
    const origin = new THREE.Vector3(ship.position.x + side, ship.position.y + 0.05, -1.2);
    const m = new THREE.Mesh(bulletGeo, bulletMat);
    m.position.copy(origin);
    scene.add(m);
    bullets.push({ m, v: new THREE.Vector3(0, 0, -BULLET_SPEED), prev: origin.clone(), life: 2.2 });
  }
}

// ---------- game flow ----------
function clearField() {
  for (const a of asteroids) scene.remove(a.m);
  asteroids.length = 0;
  for (const b of bullets) scene.remove(b.m);
  bullets.length = 0;
}

function start() {
  if (state === 'play') return;
  if (state === 'over' && performance.now() - overAt < 700) return; // stop a held trigger from restarting instantly
  clearField();
  score = 0; hull = 3; elapsed = 0; speed = 22;
  spawnTimer = 0.6; fireTimer = 0; invuln = 1.5; shake = 0;
  aim.x = 0; aim.y = -1.5;
  state = 'play';
  $('msg').classList.add('hide');
  updateHud();
}

function gameOver() {
  state = 'over';
  overAt = performance.now();
  if (score > best) {
    best = score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* storage unavailable */ }
  }
  $('title').textContent = 'SHIP LOST';
  $('desc').innerHTML = 'Score <b>' + score + '</b> · Best <b>' + best + '</b><br>Launch again?';
  $('go').textContent = 'Launch again';
  $('msg').classList.remove('hide');
  updateHud();
}

function hitShip() {
  hull -= 1;
  invuln = 1.4;
  shake = 1;
  boom(ship.position.x, ship.position.y, 0, 0x7fe9ff, 22);
  updateHud();
  if (hull <= 0) gameOver();
}

// ---------- input ----------
function setAim(e) {
  const nx = (e.clientX / window.innerWidth) * 2 - 1;
  const ny = (e.clientY / window.innerHeight) * 2 - 1;
  aim.x = clamp(nx * bounds.x * 1.1, -bounds.x, bounds.x);
  aim.y = clamp(-ny * bounds.y * 1.1, -bounds.y, bounds.y);
}

$('go').addEventListener('click', start);

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  keys[e.code] = true;
  if (!e.repeat && (e.code === 'Space' || e.code === 'Enter') && state !== 'play') start();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  firing = false;
});
addEventListener('pointermove', e => { if (state === 'play') setAim(e); });
addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('button')) return;
  firing = true;
  if (state === 'play') setAim(e);
});
addEventListener('pointerup', () => { firing = false; });
addEventListener('pointercancel', () => { firing = false; });
addEventListener('resize', resize);

// ---------- update ----------
function update(dt) {
  // steering: keys nudge the aim point, the pointer sets it directly
  const left = keys.ArrowLeft || keys.KeyA, right = keys.ArrowRight || keys.KeyD;
  const up = keys.ArrowUp || keys.KeyW, down = keys.ArrowDown || keys.KeyS;
  if (left) aim.x -= 14 * dt;
  if (right) aim.x += 14 * dt;
  if (up) aim.y += 10 * dt;
  if (down) aim.y -= 10 * dt;
  aim.x = clamp(aim.x, -bounds.x, bounds.x);
  aim.y = clamp(aim.y, -bounds.y, bounds.y);

  const k = Math.min(1, dt * 12);
  const errX = aim.x - ship.position.x;
  ship.position.x += errX * k;
  ship.position.y += (aim.y - ship.position.y) * k;
  ship.rotation.z += (clamp(-errX * 0.25, -0.5, 0.5) - ship.rotation.z) * k; // bank into the turn
  engine.scale.y = 0.8 + Math.random() * 0.5;
  ship.visible = invuln <= 0 || Math.floor(invuln * 14) % 2 === 0;

  const playing = state === 'play';
  if (playing) {
    elapsed += dt;
    speed = Math.min(48, 22 + elapsed * 0.4);
    invuln = Math.max(0, invuln - dt);

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnRock();
      spawnTimer = Math.max(0.3, 1.2 - elapsed * 0.012) * rnd(0.6, 1.4);
    }

    fireTimer -= dt;
    if ((firing || keys.Space) && fireTimer <= 0) {
      fireVolley();
      fireTimer = 0.2;
    }
  }

  // starfield
  starSpeed += ((playing ? speed * 1.4 : 10) - starSpeed) * Math.min(1, dt * 2);
  const sp = starSpeed * dt;
  for (let i = 0; i < STAR_N; i++) {
    let z = starPos[i * 3 + 2] + sp;
    if (z > 10) z -= STAR_DEPTH + 10;
    starPos[i * 3 + 2] = z;
  }
  starGeo.attributes.position.needsUpdate = true;

  // rocks
  if (playing) {
    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i], p = a.m.position;
      p.x += a.vx * dt;
      p.y += a.vy * dt;
      p.z += speed * dt;
      a.m.rotation.x += a.spin.x * dt;
      a.m.rotation.y += a.spin.y * dt;
      a.m.rotation.z += a.spin.z * dt;
      if (p.z > 12) { killRock(i, false); continue; }
      const reach = a.r * 0.95 + 0.85;
      if (invuln <= 0 && p.distanceToSquared(ship.position) < reach * reach) {
        killRock(i, true);
        hitShip();
        if (state !== 'play') break;
      }
    }
  }

  // bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i], p = b.m.position;
    b.prev.copy(p);
    p.addScaledVector(b.v, dt);
    b.life -= dt;
    let dead = b.life <= 0 || p.z < -170;
    if (!dead && playing) {
      for (let j = asteroids.length - 1; j >= 0; j--) {
        const a = asteroids[j], rr = a.r * 0.95 + 0.2;
        if (segDist2(b.prev, p, a.m.position) < rr * rr) {
          score += 10;
          killRock(j, true);
          updateHud();
          dead = true;
          break;
        }
      }
    }
    if (dead) {
      scene.remove(b.m);
      bullets.splice(i, 1);
    }
  }

  // camera follows the ship a little, with screen shake after a hit
  shake = Math.max(0, shake - dt * 2.5);
  const ox = (Math.random() - 0.5) * shake * 0.6;
  const oy = (Math.random() - 0.5) * shake * 0.6;
  cam.position.set(ship.position.x * 0.3 + ox, CAM_Y + ship.position.y * 0.15 + oy, CAM_Z);
  cam.lookAt(ship.position.x * 0.15, CAM_Y, -30);

  updateDebris(dt);
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}

resize();
updateHud();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
