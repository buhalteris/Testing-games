<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<title>Dungeon Duty</title>
<style>
:root{color-scheme:dark;--bg:#14111c;--panel:#201c2c;--panel2:#2d2840;--acc:#ffb347;--txt:#f3eefc;--mut:#9a91b5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:manipulation;transition:background 2s}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#top{padding:14px 16px 4px;text-align:center}
#energy{font-size:38px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
#top{position:relative}
#snd{position:absolute;top:8px;right:10px;display:flex;gap:6px}
#snd button{width:36px;height:36px;border-radius:50%;border:1px solid var(--panel2);background:var(--panel);font-size:16px;padding:0}
#snd button.off{opacity:.4}
#nx{height:6px;border-radius:3px;background:var(--panel2);margin:8px auto 0;width:min(70%,260px);overflow:hidden}
#nxf{height:100%;width:0;background:var(--acc);border-radius:3px;box-shadow:0 0 10px var(--acc);transition:width .25s linear}
#t-ach .card,#t-lab .card{animation:none}
.card.lock{opacity:.45;cursor:default}
.card.done{border-color:var(--acc)}
#rate{color:var(--mut);font-size:14px;min-height:20px}
#buffs{min-height:22px;font-size:13px;color:var(--acc);font-weight:700}
#stage{display:flex;align-items:center;justify-content:center;flex:0 0 auto;height:min(46vh,380px);position:relative;overflow:hidden;background:#0c0a12}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#orb{width:min(46vw,190px);height:min(46vw,190px);border-radius:50%;border:0;cursor:pointer;
background:radial-gradient(circle at 35% 30%,#fff,var(--acc) 35%,hsl(calc(var(--h) + 120) 80% 35%) 100%);
box-shadow:0 0 40px var(--acc),0 0 90px color-mix(in srgb,var(--acc) 40%,transparent);transition:transform .08s;animation:pulse 3s ease-in-out infinite}
#orb:active,#orb.hit{transform:scale(.92)}
@keyframes pulse{50%{filter:brightness(1.15)}}
.fl{position:absolute;pointer-events:none;font-weight:800;font-size:20px;color:#fff;text-shadow:0 0 8px var(--acc);animation:up .9s ease-out forwards;z-index:5}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
#gold{position:absolute;width:64px;height:64px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffc400 55%,#c77800);box-shadow:0 0 25px #ffc400;z-index:6;animation:pulse 1s infinite;font-size:26px}
#panel{flex:1;overflow-y:auto;padding:8px 12px;-webkit-overflow-scrolling:touch;min-height:0}
.tab{display:none}.tab.on{display:block}
.card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid transparent;border-radius:14px;padding:12px;margin:0 0 8px;color:var(--txt);font:inherit;cursor:pointer;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card[hidden]{display:none}
.card .i{font-size:26px;width:36px;text-align:center}
.card .m{flex:1;min-width:0}
.card .n{font-weight:700}.card .d{font-size:12.5px;color:var(--mut);margin-top:2px}
.card .c{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mut)}
.card.can{border-color:var(--acc);background:var(--panel2)}
.card.can .c{color:var(--acc)}
.card.own{opacity:.55}
.card:active.can{transform:scale(.98)}
h3{margin:12px 4px 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--panel2);font-size:14px}
.toggle{background:var(--panel);color:var(--txt);border:1px solid var(--panel2);border-radius:20px;padding:6px 14px;font:inherit;font-size:13px}
.toggle.on{border-color:var(--acc);color:var(--acc)}
#nav{display:flex;overflow-x:auto;background:var(--panel);border-top:1px solid var(--panel2)}
#nav button{flex:1 0 46px;background:none;border:0;color:var(--mut);padding:10px 0 12px;font:inherit;font-size:11px;position:relative}
#nav button.on{color:var(--acc)}
#nav button span{display:block;font-size:20px}
#nav button.new::after{content:"";position:absolute;top:6px;right:28%;width:9px;height:9px;border-radius:50%;background:#ff4d6d}
#nav button[hidden]{display:none}
#toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--acc);color:#0b0d1a;font-weight:800;padding:10px 18px;border-radius:24px;transition:transform .4s;z-index:20;max-width:90vw;text-align:center;font-size:14px}
#toast.show{transform:translate(-50%,0)}
.big{width:100%;padding:14px;border-radius:14px;border:0;background:var(--acc);color:#0b0d1a;font:inherit;font-weight:800;font-size:16px;margin:8px 0}
.big:disabled{opacity:.35}
.sqr{display:flex;align-items:center;gap:6px;margin:0 0 6px}
.sql{width:46px;font-size:11px;color:var(--mut)}
.sqg{flex:1;display:grid;grid-template-columns:repeat(16,1fr);gap:2px}
.sqc{aspect-ratio:1;padding:0;border:0;border-radius:4px;background:var(--panel2);color:#14111c;font:700 10px system-ui}
.sqc.q{background:#3d3756}
.sqc.on{background:var(--c)}
.sqc.ph{filter:brightness(1.7);box-shadow:0 0 0 1px #fff inset}
#app.studio #stage{height:min(24vh,190px)}
.sv{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--panel2)}
.sv .nm{flex:1;font-size:14px}
.sv small{display:block;color:var(--mut);font-size:12px}
[hidden]{display:none!important}
#wm{width:100%;height:auto;display:block;border-radius:14px;background:radial-gradient(ellipse at 50% 30%,#2b2540,#171322)}
.seg{fill:none;stroke:var(--mut);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round;opacity:.25}
.seg.on{opacity:.9;stroke:var(--acc)}
.node{cursor:pointer}
.node .disc{fill:var(--panel2);stroke:var(--mut);stroke-width:2}
.node .ring{fill:none;stroke:var(--acc);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.node.new .disc{stroke:var(--acc)}
.node.new .ring{animation:ringp 1.4s ease-out infinite}
.node.new .em{filter:brightness(0)}
.node.fog{opacity:.4;cursor:default}
.node.caught .disc{stroke:#51cf66}
.node .lbl{fill:var(--txt);font:700 11px system-ui,sans-serif;text-anchor:middle}
.node .sub{fill:var(--mut);font:600 10px system-ui,sans-serif;text-anchor:middle}
@keyframes ringp{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.card.lockc{opacity:.75;border:1px dashed var(--mut)}
#enc{position:fixed;inset:0;z-index:15;background:rgba(10,8,16,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.encbox{width:min(92vw,420px);display:flex;flex-direction:column;gap:10px;text-align:center}
#enct{font-size:20px;font-weight:800}
#encp{font-size:22px;letter-spacing:6px;color:var(--acc);min-height:28px}
.encbar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
#encf{display:block;height:100%;width:100%;background:var(--acc)}
#arena{position:relative;height:min(52vh,340px);background:#1b1726;border-radius:16px;border:1px solid var(--panel2);overflow:hidden;touch-action:none}
#crit{position:absolute;left:0;top:0;border:0;background:none;padding:0;line-height:1;touch-action:none;cursor:pointer}
.encx{display:flex;gap:10px;justify-content:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.big.stop{background:#ff6b6b}
.hint{color:var(--mut);font-size:13px;text-align:center;padding:14px}
</style>
</head>
<body>
<div id="app">
  <div id="top"><div id="snd"><button id="bmus" aria-label="music">🎵</button><button id="bsfx" aria-label="sound effects">🔊</button></div><div id="energy">0</div><div id="rate"></div><div id="buffs"></div><div id="nx" hidden title="Progress to your next unlock"><div id="nxf"></div></div></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="panel">
    <div class="tab" id="t-build"></div>
    <div class="tab" id="t-ups"></div>
    <div class="tab" id="t-map"></div>
    <div class="tab" id="t-asc"></div>
    <div class="tab" id="t-stats"></div>
    <div class="tab" id="t-ach"></div>
    <div class="tab" id="t-lab"></div>
    <div class="tab" id="t-studio"></div>
    <div class="hint" id="starthint">Tap the grime to clean it…</div>
  </div>
  <div id="nav">
    <button data-t="build" hidden><span>🧹</span>Crew</button>
    <button data-t="map" hidden><span>🗺️</span>Map</button>
    <button data-t="ups" hidden><span>🎒</span>Gear</button>
    <button data-t="lab" hidden><span>🔨</span>Forge</button>
    <button data-t="ach" hidden><span>🏆</span>Awards</button>
    <button data-t="studio" hidden><span>🎹</span>Studio</button>
    <button data-t="asc" hidden><span>🏅</span>Promote</button>
    <button data-t="stats" hidden><span>📊</span>Stats</button>
  </div>
</div>
<div id="toast"></div>
<div id="enc" hidden><div class="encbox"><div id="enct"></div><div id="encp"></div><div class="encbar"><i id="encf"></i></div><div id="arena"><button id="crit" hidden></button></div><div class="encx"><button class="toggle" id="encretry" hidden>Try again</button><button class="toggle" id="encclose">Close</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const SUF=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
function fmt(n){
  if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n).toString();
  const i=Math.min(Math.floor(Math.log10(n)/3),SUF.length-1);
  const v=n/Math.pow(1000,i);
  return v.toFixed(v<10?2:v<100?1:0)+SUF[i];
}

/* ---------- game data ---------- */
const GENS=[
 {id:"imp",icon:"👿",name:"Mop Imp",base:15,cps:0.5},
 {id:"slime",icon:"🦠",name:"Slime Sweeper",base:150,cps:4},
 {id:"skel",icon:"💀",name:"Skeleton Maid",base:1500,cps:30},
 {id:"gob",icon:"👺",name:"Goblin Crew",base:15000,cps:220},
 {id:"ghost",icon:"👻",name:"Ghost Duster",base:2e5,cps:1800},
 {id:"golem",icon:"🗿",name:"Golem Scrubber",base:3e6,cps:15000},
 {id:"wiz",icon:"🧙",name:"Cleaning Wizard",base:5e7,cps:130000},
 {id:"drag",icon:"🐉",name:"Dragon Power-Washer",base:1e9,cps:1.2e6},
];
const UPS=[];
const U=(o)=>UPS.push(o);
// cleaning upgrades
U({id:"t1",icon:"🧹",name:"Better Mop",desc:"Cleaning power ×2",cost:50,tap:2});
U({id:"t2",icon:"🪣",name:"Steel Bucket",desc:"Cleaning power ×2",cost:500,tap:2,req:()=>S.ups.t1});
U({id:"t3",icon:"✨",name:"Enchanted Mop",desc:"Cleaning power ×3",cost:2e4,tap:3,req:()=>S.ups.t2});
U({id:"t4",icon:"🔱",name:"Mop of Legends",desc:"Cleaning power ×5",cost:2e6,tap:5,req:()=>S.ups.t3});
U({id:"tp1",icon:"🫧",name:"Soapy Suds",desc:"Each clean also gives 3% of your /s",cost:5e3,tapcps:.03,req:()=>S.ups.t2});
U({id:"tp2",icon:"🌊",name:"Bubble Chorus",desc:"Each clean gives 10% of your /s in total",cost:5e5,tapcps:.07,req:()=>S.ups.tp1});
// features (kept after promotion)
U({id:"auto",icon:"🪄",name:"Self-Mopping Mop",desc:"Mops by itself, 3 times a second",cost:1500,keep:1});
U({id:"auto2",icon:"🧙",name:"Self-Mopping Mop II",desc:"Mops 10 times a second",cost:3e5,keep:1,req:()=>S.ups.auto});
U({id:"orbs",icon:"💰",name:"Loot Goblin Bait",desc:"Loot goblins sometimes sneak by. Catch them!",cost:8000,keep:1});
U({id:"buyer",icon:"📋",name:"Crew Foreman",desc:"Hires crew for you automatically (toggle in Stats)",cost:25000,keep:1,req:()=>S.ups.auto});
// per-crew
GENS.forEach(g=>{
  U({id:g.id+"1",icon:g.icon,name:"Training: "+g.name,desc:g.name+" output ×2",cost:g.base*60,gen:[g.id,2],req:()=>S.g[g.id]>=10});
  U({id:g.id+"2",icon:g.icon,name:"Better Tools: "+g.name,desc:g.name+" output ×2",cost:g.base*600,gen:[g.id,2],req:()=>S.g[g.id]>=25});
  U({id:g.id+"3",icon:g.icon,name:"Mastery: "+g.name,desc:g.name+" output ×3",cost:g.base*12000,gen:[g.id,3],req:()=>S.g[g.id]>=50});
});
// global
U({id:"gl1",icon:"🏷️",name:"Dungeon Contract",desc:"Everything ×1.5",cost:1e5,all:1.5,req:()=>totalGens()>=15});
U({id:"gl2",icon:"📜",name:"Royal Charter",desc:"Everything ×2",cost:5e7,all:2,req:()=>S.ups.gl1});
U({id:"gl3",icon:"👑",name:"Dark Lord's Blessing",desc:"Everything ×3",cost:5e10,all:3,req:()=>S.ups.gl2});
UPS.sort((a,b)=>a.cost-b.cost);

/* ---------- state ---------- */
const fresh=()=>({e:0,run:0,life:0,g:Object.fromEntries(GENS.map(g=>[g.id,0])),ups:{},seenG:{},seenU:{},
  cores:0,taps:0,lab:{},ach:{},golds:0,caught:{},asc:0,tabs:{},opts:{auto:1,buyer:1,music:1,sfx:1},last:Date.now(),t0:Date.now()});
let S=fresh();
function load(){
  try{
    const j=JSON.parse(localStorage.getItem("dungeon1")||"null");
    if(j){S=Object.assign(fresh(),j);S.g=Object.assign(fresh().g,j.g);S.opts=Object.assign(fresh().opts,j.opts||{});GENS.forEach(g=>{if(S.g[g.id]>0)S.caught[g.id]=1});}
  }catch(e){}
}
function save(){S.last=Date.now();try{localStorage.setItem("dungeon1",JSON.stringify(S))}catch(e){}}

/* ---------- maths ---------- */
let frenzy=0; // seconds left
const totalGens=()=>GENS.reduce((a,g)=>a+S.g[g.id],0);
const coreMult=()=>1+S.cores*0.1;
function allMult(){let m=coreMult()*(1+0.02*achCount());for(const u of UPS)if(S.ups[u.id]&&u.all)m*=u.all;return m*(frenzy>0?7:1)*(studioOn?1+grooveAmt():1)}
function genMult(id){let m=1+0.2*(S.lab.heat||0);for(const u of UPS)if(S.ups[u.id]&&u.gen&&u.gen[0]===id)m*=u.gen[1];return m}
function cps(){let t=0;for(const g of GENS)t+=S.g[g.id]*g.cps*genMult(g.id);return t*allMult()}
function tapPower(){
  let m=1,pc=0;
  for(const u of UPS)if(S.ups[u.id]){if(u.tap)m*=u.tap;if(u.tapcps)pc+=u.tapcps}
  return m*allMult()*Math.pow(1.5,S.lab.tapc||0)+cps()*pc;
}
const gCost=g=>Math.ceil(g.base*Math.pow(1.15,S.g[g.id]));
const coresOnAscend=()=>Math.floor(Math.sqrt(S.run/1e6));

/* ---------- actions ---------- */
function gain(n){S.e+=n;S.run+=n;S.life+=n}
function tap(n,x,y){
  const p=tapPower()*n;gain(p);S.taps+=n;
  if(x!==undefined)floaty("+"+fmt(p),x,y);
}
function buyGen(g){if(!S.caught[g.id])return false;const c=gCost(g);if(S.e>=c){S.e-=c;S.g[g.id]++;return true}return false}
function buyUp(u){if(!S.ups[u.id]&&S.e>=u.cost){S.e-=u.cost;S.ups[u.id]=1;toast("Unlocked: "+u.name);sfx.up();refresh(true);return true}return false}
const armed={};
function ask(k,msg){if(armed[k]){armed[k]=0;return true}armed[k]=1;toast(msg);setTimeout(()=>armed[k]=0,4000);return false}
function ascend(){
  const c=coresOnAscend();if(c<1)return;
  if(!ask("asc","Promotion: restart your shift, gain "+c+" Medals (+"+c*10+"%). Tap again to confirm"))return;
  S.cores+=c;S.asc++;S.e=0;S.run=0;S.lab={};
  GENS.forEach(g=>S.g[g.id]=0);
  for(const u of UPS)if(!u.keep)delete S.ups[u.id];
  S.seenG={};S.seenU={};
  save();refresh(true);toast("Promoted! +"+c+" Medals 🏅");sfx.asc();
}

/* ---------- UI ---------- */
const stage=$("#stage");
function floaty(txt,x,y){
  if(stage.querySelectorAll(".fl").length>14)return;
  const r=stage.getBoundingClientRect(),d=document.createElement("div");
  d.className="fl";d.textContent=txt;d.style.left=(x-r.left-20+Math.random()*30-15)+"px";d.style.top=(y-r.top-20)+"px";
  stage.appendChild(d);setTimeout(()=>d.remove(),900);
}
let toastT;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),2600)}


// build generator cards
const gEls={},uEls={};
function mkCard(icon,name,desc,onclick){
  const b=document.createElement("button");b.className="card";b.hidden=true;
  b.innerHTML='<div class="i"></div><div class="m"><div class="n"></div><div class="d"></div></div><div class="c"></div>';
  b.querySelector(".i").textContent=icon;b.querySelector(".n").textContent=name;b.querySelector(".d").textContent=desc;
  b.onclick=onclick;return b;
}
function initUI(){
  const tb=$("#t-build");tb.innerHTML="<h3>Crew</h3>";
  GENS.forEach(g=>{const el=mkCard(g.icon,g.name,"",()=>{if(!S.caught[g.id]){toast("🗺️ Catch the "+g.name+" on the World Map first!");showTab("map");return}if(buyGen(g)){sfx.buy();upd()}});tb.appendChild(el);gEls[g.id]=el});
  const tu=$("#t-ups");tu.innerHTML="<h3>Gear</h3>";
  UPS.forEach(u=>{const el=mkCard(u.icon,u.name,u.desc,()=>buyUp(u)&&upd());tu.appendChild(el);uEls[u.id]=el});
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>showTab(b.dataset.t));
}
let cur=null;
function showTab(t){
  cur=t;
  document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("on",e.id==="t-"+t));
  document.querySelectorAll("#nav button").forEach(b=>{b.classList.toggle("on",b.dataset.t===t);if(b.dataset.t===t)b.classList.remove("new")});
  $("#starthint").style.display="none";
  if(["asc","stats","ach","lab"].includes(t))renderStatic();if(t==="studio"&&sqCells.k)paintSeq();$("#app").classList.toggle("studio",t==="studio"||t==="map");if(t==="map"){paintMap();$("#nav button[data-t=map]").classList.remove("new")}
}
const TH={build:12,map:12,ups:60,stats:400,ach:5000,studio:25000,asc:1e6,lab:5e6};
const TABRULE=Object.fromEntries(Object.keys(TH).map(t=>[t,()=>S.life>=TH[t]||(t==="asc"&&S.asc>0)]));
const TABMSG={build:"🧹 Crew unlocked!",ups:"🎒 Gear unlocked!",stats:"📊 Stats unlocked!",asc:"🏅 Promotion unlocked!",ach:"🏆 Achievements unlocked!",lab:"🔨 Forge unlocked!",studio:"🎹 Studio unlocked!",map:"🗺️ World Map unlocked! Catch your crew there"};
function updTabs(){
  for(const t in TABRULE){
    const b=document.querySelector('#nav button[data-t="'+t+'"]');
    if(TABRULE[t]()&&b.hidden){
      b.hidden=false;
      if(!S.tabs[t]){S.tabs[t]=1;toast(TABMSG[t]);sfx.unlock();b.classList.add("new")}
      if(!cur)showTab(t);
    }
  }
}
function refresh(){ // reveal logic
  checkAch();
  for(const g of GENS)if(!S.seenG[g.id]&&S.life>=g.base*0.6){S.seenG[g.id]=1;if(!S.caught[g.id]){const mb=document.querySelector('#nav button[data-t="map"]');if(mb&&!mb.hidden&&cur!=="map"){mb.classList.add("new");toast("🗺️ Something new on the map!")}}}
  for(const u of UPS)if(!S.ups[u.id]&&!S.seenU[u.id]&&S.life>=u.cost*0.25&&(!u.req||u.req())){S.seenU[u.id]=1;
    const b=document.querySelector('#nav button[data-t="ups"]');if(cur!=="ups"&&!b.hidden)b.classList.add("new")}
}
function upd(){
  $("#energy").textContent="🪙 "+fmt(S.e);
  const c=cps();
  $("#rate").textContent=c>0?fmt(c)+" per second":"";
  $("#buffs").textContent=frenzy>0?"🔥 FRENZY ×7 — "+Math.ceil(frenzy)+"s":"";
  for(const g of GENS){
    const el=gEls[g.id],seen=S.seenG[g.id];el.hidden=!seen;if(!seen)continue;
    const cost=gCost(g),got=S.caught[g.id];
    el.classList.toggle("lockc",!got);
    el.querySelector(".n").textContent=got?g.name+"  ×"+S.g[g.id]:g.name;
    el.querySelector(".d").textContent=got?"+"+fmt(g.cps*genMult(g.id)*allMult())+"/s each":"🔒 Catch it on the World Map first";
    el.querySelector(".c").textContent=got?fmt(cost):"🗺️";
    el.classList.toggle("can",!!got&&S.e>=cost);
  }
  for(const u of UPS){
    const el=uEls[u.id];

function dunFrame(dt){
  if(!DUN)return;
  clock+=dt;
  syncT+=dt;if(syncT>.5){syncT=0;syncDungeon()}
  // messes
  const built=builtIdx().length,cap=Math.min(4+built*3,24);
  spawnT-=dt;if(spawnT<=0){spawnT=Math.max(.25,1.3/(1+HELP.length*.15));if(MESS.length<cap)spawnMess()}
  for(const m of MESS)if(m.userData.s<1){m.userData.s=Math.min(1,m.userData.s+dt*3);const s=m.userData.s;m.scale.set(s,s*(m.userData.sy||1),s)}
  HELP.forEach(h=>stepHelper(h,dt));
  for(let i=PUF.length-1;i>=0;i--){const p=PUF[i],u=p.userData;u.life-=dt;u.v.y-=6*dt;p.position.addScaledVector(u.v,dt);p.scale.setScalar(Math.max(.01,u.life/.6));if(u.life<=0){DUN.scene.remove(p);PUF.splice(i,1)}}
  // rooms rising + torches
  ROOMS.forEach((R,i)=>{
    if(!R.built)return;
    if(R.rise<1){R.rise=Math.min(1,R.rise+dt/1.1);const e=1-Math.pow(1-R.rise,3);R.grp.scale.y=Math.max(.01,e)}
    R.light.intensity=1.15+Math.sin(clock*9+i*2)*.14+Math.random()*.08;
    R.flame.scale.set(1,.9+Math.random()*.3,1);
  });
  DUN.amb.intensity=.5+.04*Math.min(9,Math.log10(S.life+1));
  // camera frames all built rooms
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  for(const R of ROOMS)if(R.built){x0=Math.min(x0,R.g[0]*RW);x1=Math.max(x1,R.g[0]*RW);z0=Math.min(z0,R.g[1]*RW);z1=Math.max(z1,R.g[1]*RW)}
  const W=(x1-x0+RW)*1.2+2,D=z1-z0+RW+1,asp=DUN.camera.aspect,vt=Math.tan(22.5*Math.PI/180);
  const want={x:(x0+x1)/2,z:(z0+z1)/2+.6,d:Math.max((W/2)/(vt*asp),(D*.85)/(2*vt))*1.08+2};
  const k=1-Math.exp(-dt*1.6);
  camNow.x+=(want.x-camNow.x)*k;camNow.z+=(want.z-camNow.z)*k;camNow.d+=(want.d-camNow.d)*k;
  const az=.45+.1*Math.sin(clock*.2),el=1.0;
  DUN.camera.position.set(camNow.x+Math.sin(az)*Math.cos(el)*camNow.d,Math.sin(el)*camNow.d,camNow.z+Math.cos(az)*Math.cos(el)*camNow.d);
  DUN.camera.lookAt(camNow.x,0,camNow.z);
  DUN.renderer.render(DUN.scene,DUN.camera);
}

/* ---------- loop ---------- */
let prev=performance.now(),uiT=0,saveT=0,autoAcc=0,buyT=0;
function loop(now){
  const dt=Math.min((now-prev)/1000,.5);prev=now;
  gain(cps()*dt);
  if(frenzy>0)frenzy=Math.max(0,frenzy-dt);
  if(S.ups.auto&&S.opts.auto){autoAcc+=dt*(S.ups.auto2?10:3);const n=Math.floor(autoAcc);if(n){autoAcc-=n;tap(n);autoClean()}}
  if(S.ups.buyer&&S.opts.buyer){buyT+=dt;if(buyT>.5){buyT=0;
    for(let i=GENS.length-1;i>=0;i--){const g=GENS[i];if(S.seenG[g.id]&&buyGen(g))break}}}
  if(S.ups.orbs){goldT-=dt;if(goldT<=0){goldT=(45+Math.random()*60)/(1+0.25*(S.lab.luck||0));if(!$("#gold"))spawnGold()}}
  dunFrame(dt);studioFrame();encFrame(dt);if(studioOn&&cur==="studio")S.sqTime=(S.sqTime||0)+dt;
  uiT+=dt;if(uiT>.1){uiT=0;refresh();upd()}
  saveT+=dt;if(saveT>5){saveT=0;save()}
  requestAnimationFrame(loop);
}

/* ---------- audio (all synthesized, no files) ---------- */
let AC=null,masterG,musicG,sfxG,mTimer=null,nextT=0,mStep=0,tapI=0,lastTap=0;
const PENT=[0,2,4,7,9],mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(!AC){
    try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    masterG=AC.createGain();masterG.gain.value=.8;masterG.connect(AC.destination);
    musicG=AC.createGain();sfxG=AC.createGain();musicG.connect(masterG);sfxG.connect(masterG);
    applyAudioOpts();
    mTimer=setInterval(sched,100);
  }
  if(AC.state==="suspended")AC.resume();
}
function applyAudioOpts(){
  if(!AC)return;
  musicG.gain.setTargetAtTime(S.opts.music?.7:0,AC.currentTime,.3);
  sfxG.gain.setTargetAtTime(S.opts.sfx?1:0,AC.currentTime,.05);
  nextT=Math.max(nextT,AC.currentTime+.1);
}
function tone(type,f,dur,vol,t0,dest,slide){
  if(!AC)return;t0=t0||AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(dest||sfxG);o.start(t0);o.stop(t0+dur+.05);
}
function pad(f,t0,dur,vol){
  const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+dur*.35);g.gain.linearRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(musicG);o.start(t0);o.stop(t0+dur+.05);
}
const sfx={
  tap(){if(!AC)return;const n=performance.now();if(n-lastTap<35)return;if(n-lastTap>900)tapI=0;lastTap=n;
    const i=tapI++;tone("sine",mtof(72+PENT[i%5]+12*(((i/5)|0)%2)),.1,.14)},
  buy(){tone("triangle",mtof(76),.09,.12);tone("triangle",mtof(83),.12,.12,AC&&AC.currentTime+.07)},
  up(){if(!AC)return;const t=AC.currentTime;[72,76,79,84].forEach((m,i)=>tone("triangle",mtof(m),.18,.12,t+i*.06));stab(CH7[(mStep>>4)&3],t,.6,.9,3800,sfxG)},
  unlock(){if(!AC)return;const t=AC.currentTime;[79,83,86,91].forEach((m,i)=>tone("sine",mtof(m),.5,.14,t+i*.09))},
  gold(){tone("sine",mtof(96),.5,.08,0,0,mtof(100))},
  sparkle(){if(!AC)return;const t=AC.currentTime;for(let i=0;i<8;i++)tone("sine",mtof(84+PENT[i%5]+12*(i>4?1:0)),.25,.1,t+i*.05)},
  asc(){if(!AC)return;const t=AC.currentTime;tone("sawtooth",110,1.4,.1,t,0,880);[60,67,72,79,84].forEach((m,i)=>tone("sine",mtof(m),1.2,.1,t+.5+i*.12))}
};
function stab(ns,t,dur,vol,cut,dest){
  if(!AC)return;t=t||AC.currentTime;
  const f=AC.createBiquadFilter();f.type="lowpass";f.Q.value=4;
  f.frequency.setValueAtTime(cut,t);f.frequency.exponentialRampToValueAtTime(Math.max(300,cut*.15),t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.012*vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  f.connect(g);g.connect(dest||musicG);
  ns.forEach(n=>[-7,7].forEach(d=>{const o=AC.createOscillator();o.type="sawtooth";o.frequency.value=mtof(n+12);o.detune.value=d;o.connect(f);o.start(t);o.stop(t+dur+.05)}));
}
const CH7=[[57,60,64,67],[53,57,60,64],[48,52,55,59],[55,59,62,64]];
// generative music: Am - F - C - G. More layers appear as you progress.
const CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],SP=60/78/2;
const musStage=()=>Math.min(6,Math.floor(Math.log10(S.life+1)/1.2));
function playStep(s,t){
  const ch=CH[(s>>4)&3],st=musStage();
  if(s%16===0)ch.forEach(n=>pad(mtof(n-12),t,SP*17,.05));
  const c7=CH7[(s>>4)&3];
  if(st===1&&s%16===8)stab(c7,t,SP*5,.7,1800);
  if(st>=2&&s%8===0)stab(c7,t,SP*2.2,.8,2500+st*400);
  if(st>=4&&(s%8===3||s%8===6))stab(c7,t,SP*1.2,.6,3500);
  if(st>=1&&s%(st>=2?2:4)===0){let n=ch[(s>>1)%3]+12;if(st>=3&&s%8>=4)n+=12;tone("triangle",mtof(n),.35,.05,t,musicG)}
  if(st>=3&&s%8===0)tone("sine",mtof(ch[0]-24),SP*3,.16,t,musicG);
  if(st>=4&&s%8===4)tone("sine",mtof(ch[0]-24),SP*2,.12,t,musicG);
  if(st>=5&&s%4===2)tone("sine",mtof(ch[2]+24),.3,.03,t,musicG);
  if(frenzy>0&&s%2===1)tone("square",mtof(ch[1]+24),.1,.025,t,musicG);
}
function sched(){
  if(!AC||!S.opts.music||document.hidden||studioOn)return;
  if(nextT<AC.currentTime)nextT=AC.currentTime+.05;
  while(nextT<AC.currentTime+.35){playStep(mStep,nextT);nextT+=SP;mStep++}
}

let studioOn=false,sqNext=0,sqStep=0,sqBar=0,sqPh=-1,SQG=null,noiseBuf=null;

 {k:"b",name:"Bass",col:"#51cf66"},{k:"c",name:"Chord",col:"#4dabf7"},{k:"l",name:"Lead",col:"#da77f2"}];

 house:()=>({k:mkRow([0,4,8,12]),s:mkRow([4,12]),h:mkRow([2,6,10,14]),b:mkRow([0,3,6,8,11,14]),c:mkRow([0,10]),l:mkRow([])}),

 empty:()=>({k:mkRow([]),s:mkRow([]),h:mkRow([]),b:mkRow([]),c:mkRow([]),l:mkRow([])}),
 random:()=>{const o=SQPRE.empty(),p={k:.25,s:.15,h:.4,b:.25,c:.12};

const grooveAmt=()=>Math.min(.5,noteCount()*.01);
function sqOut(){if(!SQG){SQG=AC.createGain();SQG.gain.value=.9;SQG.connect(masterG)}return SQG}
function noiseHit(t,o,type,freq,dur,vol){
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=noiseBuf;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  src.connect(f);f.connect(g);g.connect(o);src.start(t);src.stop(t+dur+.02);
}
function playHit(r,v,t){
  const o=sqOut(),sd=60/S.bpm/4,ch=CH7[sqBar%4];
  if(r==="k"){const x=AC.createOscillator(),g=AC.createGain();x.type="sine";x.frequency.setValueAtTime(150,t);x.frequency.exponentialRampToValueAtTime(45,t+.15);
    g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);x.connect(g);g.connect(o);x.start(t);x.stop(t+.35)}
  else if(r==="s"){noiseHit(t,o,"bandpass",1800,.18,.5);tone("triangle",190,.1,.25,t,o,120)}
  else if(r==="h")noiseHit(t,o,"highpass",7000,.05,.35);
  else if(r==="b")tone("triangle",mtof(ch[0]-24),sd*1.8,.35,t,o);
  else if(r==="c")stab(ch,t,sd*3,.9,3000,o);
  else if(r==="l")tone("square",mtof(81+PM[v-1]-12),sd*1.5,.06,t,o);

function sqSched(){

    sqQ.push({t:sqNext,s:sqStep});if(sqQ.length>64)sqQ.shift();
    sqNext+=sd;sqStep=(sqStep+1)%16;if(sqStep===0)sqBar++;
  }

  for(let i=0;i<REGIONS.length-1;i++){
    const a=REGIONS[i],b=REGIONS[i+1];
    segEls.push(svgEl("path",{d:"M"+a.x+" "+a.y+" C "+a.x+" "+(a.y-45)+", "+b.x+" "+(b.y+45)+", "+b.x+" "+b.y,class:"seg"},svg));
  }
  REGIONS.forEach((r,i)=>{
    const g=svgEl("g",{class:"node fog","data-id":r.id,transform:"translate("+r.x+" "+r.y+")"},svg);
    svgEl("circle",{class:"ring",r:32},g);svgEl("circle",{class:"disc",r:27},g);
    const em=svgEl("text",{class:"em","text-anchor":"middle",dy:".35em","font-size":28},g);
    const lb=svgEl("text",{class:"lbl",y:46},g),sb=svgEl("text",{class:"sub",y:59},g);
    mapEls[r.id]={g,em,lb,sb};
  });
  svg.addEventListener("click",e=>{const g=e.target.closest(".node");if(g)nodeTap(g.dataset.id)});
  $("#crit").addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();encHit()});
  $("#encclose").onclick=closeEnc;
  $("#encretry").onclick=()=>{if(enc)startEnc(GENS[enc.gi].id)};
  paintMap();
}
const mapState=id=>S.caught[id]?"caught":S.seenG[id]?"new":"fog";
function paintMap(){
  let n=0;
  REGIONS.forEach((r,i)=>{
    const m=mapEls[r.id],st=mapState(r.id),g=GENS[i];
    m.g.setAttribute("class","node "+st);
    const e=st==="fog"?"❓":g.icon,l=st==="fog"?"Undiscovered":r.name,
      s=st==="caught"?g.name+" ×"+S.g[g.id]:st==="new"?"Something lurks here…":"";
    if(m.em.textContent!==e)m.em.textContent=e;
    if(m.lb.textContent!==l)m.lb.textContent=l;
    if(m.sb.textContent!==s)m.sb.textContent=s;
    if(st==="caught")n++;
    if(i>0)segEls[i-1].setAttribute("class","seg"+(mapState(r.id)==="fog"?"":" on"));
  });
  $("#mapnote").textContent="Caught "+n+" of "+GENS.length+". Tap a glowing spot to catch what lives there. You must catch each crew type once before you can hire it.";
}
function nodeTap(id){
  const st=mapState(id),g=GENS.find(x=>x.id===id);
  if(st==="new")startEnc(id);
  else if(st==="caught")toast(g.icon+" "+g.name+" is on your crew");
  else toast("Keep earning coins to discover this area");
}
let enc=null;
function startEnc(id){
  const gi=GENS.findIndex(g=>g.id===id);if(gi<0)return;
  $("#enc").hidden=false;
  const ar=$("#arena"),size=Math.max(48,72-gi*3);
  enc={gi,need:3+gi,hits:0,t:0,tmax:10,size,speed:130+gi*22,vx:0,vy:0,turn:0,done:false,aw:ar.clientWidth,ah:ar.clientHeight};
  enc.x=(enc.aw-size)/2;enc.y=(enc.ah-size)/2;aimEnc();
  const c=$("#crit");c.textContent=GENS[gi].icon;c.style.width=c.style.height=size+"px";c.style.fontSize=(size*.78)+"px";c.hidden=false;
  $("#enct").textContent="Catch the "+GENS[gi].name+"!";
  $("#encretry").hidden=true;paintEnc();
}
function aimEnc(){const a=Math.random()*Math.PI*2;enc.vx=Math.cos(a)*enc.speed;enc.vy=Math.sin(a)*enc.speed}
function paintEnc(){
  $("#encp").textContent="●".repeat(enc.hits)+"○".repeat(enc.need-enc.hits);
  $("#encf").style.width=Math.max(0,100*(1-enc.t/enc.tmax))+"%";
}
function encHit(){
  if(!enc||enc.done)return;
  enc.hits++;enc.speed*=1.18;aimEnc();sfx.buy();
  if(enc.hits>=enc.need){
    enc.done=true;const g=GENS[enc.gi];
    S.caught[g.id]=1;if(S.g[g.id]<1)S.g[g.id]=1;
    $("#enct").textContent="🎉 Caught! It joins your crew";$("#crit").hidden=true;paintEnc();
    sfx.sparkle();toast("🎉 Caught the "+g.name+"! You can hire more now");save();upd();
    setTimeout(closeEnc,1300);
  }else paintEnc();
}
function closeEnc(){$("#enc").hidden=true;enc=null;if(cur==="map")paintMap()}
function encFrame(dt){
  if(!enc||enc.done)return;
  enc.t+=dt;enc.turn+=dt;if(enc.turn>.9){enc.turn=0;aimEnc()}
  enc.x+=enc.vx*dt;enc.y+=enc.vy*dt;
  const mx=enc.aw-enc.size,my=enc.ah-enc.size;
  if(enc.x<0){enc.x=0;enc.vx=Math.abs(enc.vx)}if(enc.x>mx){enc.x=mx;enc.vx=-Math.abs(enc.vx)}
  if(enc.y<0){enc.y=0;enc.vy=Math.abs(enc.vy)}if(enc.y>my){enc.y=my;enc.vy=-Math.abs(enc.vy)}
  $("#crit").style.transform="translate("+enc.x.toFixed(1)+"px,"+enc.y.toFixed(1)+"px)";
  $("#encf").style.width=Math.max(0,100*(1-enc.t/enc.tmax))+"%";
  if(enc.t>=enc.tmax){enc.done=true;$("#enct").textContent="It got away!";$("#crit").hidden=true;$("#encretry").hidden=false}
}

/* ---------- boot ---------- */
load();initUI();dunInit();initStudio();initMap();
// offline progress
{
  const away=Math.min((Date.now()-S.last)/1000,8*3600),c=cps();
  if(away>60&&c>0){const g=c*away*0.5;gain(g);setTimeout(()=>toast("Welcome back! +"+fmt(g)+" while away"),400)}
}
refresh();upd();
if(S.life>=12){const f=["build","ups","stats","asc"].find(t=>TABRULE[t]());showTab(f)}
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();else prev=performance.now()});
addEventListener("pagehide",save);
requestAnimationFrame(loop);
</script>
</body>
